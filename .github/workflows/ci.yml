name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  minitest:
    permissions: write-all
    name: Minitest
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: mysql2://root:mysql@127.0.0.1:3306/intercode_import_test
      EVENTLITE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/eventlite_test
    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: intercode_import_test
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventlite_test
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Run tests
        run: TERM=xterm-color bundle exec rake test
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: "Minitest Report"
          report_paths: "test/reports/TEST-*.xml"
          detailed_summary: true
          skip_success_summary: true
      - name: Archive HTML test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: minitest-reports
          path: test/html_reports/*
